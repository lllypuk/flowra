# Application configuration
app:
  # Wiring mode: "real" (default) or "mock"
  # In production, only "real" mode is allowed.
  # Use "mock" only for development/testing without external dependencies.
  mode: "real"
  name: "flowra"

server:
  # Tokens are bearer secrets over plain HTTP: the API refuses to start on a non-loopback address.
  host: "127.0.0.1"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

mongodb:
  # DEV: No auth for local development with replica set
  # PROD: Use authenticated URI, e.g.:
  #   uri: "mongodb://user:password@host:27017/?replicaSet=rs0&authSource=admin"
  uri: "mongodb://localhost:27017/?replicaSet=rs0"
  database: "flowra"
  timeout: 10s
  max_pool_size: 100

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10

auth:
  # The token named "owner" comes from AUTH_OWNER_TOKEN_SHA256 (hex SHA-256 of a random secret).
  # More tokens, one per device:
  # tokens:
  #   - name: "phone"
  #     sha256: "<hex sha256 of a random secret>"
  owner:
    username: "owner"
    email: "owner@flowra.local"
  session_ttl: 720h

eventbus:
  type: "redis" # redis | inmemory
  redis_channel_prefix: "events."

log:
  level: "info" # debug | info | warn | error
  format: "text" # json | text

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: 30s
  pong_timeout: 60s

uploads:
  dir: "uploads"
  max_file_size: 10485760  # 10 MB
