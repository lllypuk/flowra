app:
  mode: "real"
  name: "flowra"

server:
  # The app runs on the host network and must stay on loopback.
  host: "127.0.0.1"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

mongodb:
  uri: "mongodb://localhost:27017/?directConnection=true"
  database: "flowra"
  timeout: 10s
  max_pool_size: 100

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10

auth:
  # Token digests come from AUTH_OWNER_TOKEN_SHA256 or auth.tokens.
  owner:
    username: "owner"
    email: "owner@flowra.local"
  session_ttl: 720h

eventbus:
  type: "redis"
  redis_channel_prefix: "events."

log:
  level: "info"
  format: "json"

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: 30s
  pong_timeout: 60s

outbox:
  enabled: true
  poll_interval: 100ms
  batch_size: 100
  max_retries: 5
  cleanup_age: 168h
  cleanup_interval: 1h

uploads:
  dir: "/app/uploads"
  max_file_size: 10485760
