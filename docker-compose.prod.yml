services:
  mongodb:
    image: mongo:6.0
    container_name: flowra-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth"]
    # The app runs on the host network; publish on loopback only.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME is required}",
          "--password",
          "${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flowra-network

  mongo-init:
    image: mongo:6.0
    container_name: flowra-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}
    command: >
      sh -c "
        until mongosh --host mongodb:27017 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" >/dev/null 2>&1; do
          echo 'Waiting for MongoDB to accept connections...';
          sleep 2;
        done;
        mongosh --host mongodb:27017 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval '
          try {
            rs.status();
            print(\"Replica set already initialized\");
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] });
            print(\"Replica set initialized\");
          }
        '
      "
    restart: "no"
    networks:
      - flowra-network

  redis:
    image: redis:7-alpine
    container_name: flowra-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flowra-network

  app:
    build: .
    container_name: flowra-app
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Token auth requires a loopback listener, which a bridge network cannot give; see configs/config.prod.yaml.
    network_mode: host
    environment:
      # directConnection: the replica set member is named mongodb:27017, which the host cannot resolve.
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME is required}:${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}@localhost:27017/?directConnection=true&authSource=admin
      MONGODB_DATABASE: flowra
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AUTH_OWNER_TOKEN_SHA256: ${AUTH_OWNER_TOKEN_SHA256:?AUTH_OWNER_TOKEN_SHA256 is required}
      FLOWRA_WORKER: ${FLOWRA_WORKER:-true}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  uploads_data:

networks:
  flowra-network:
    driver: bridge
